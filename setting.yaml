# Binance OpenRouter Trader runtime config

# Trading loop
cycle_interval_seconds: 60

# LLM trigger: re-evaluate a slot when price moves +/- this percent
# from that slot's last LLM decision anchor.
trigger_pct_usdt: 1.0

# Prompt input: 100 recent 1h close prices, with the newest value aligned
# to the live reference price.
ai_prompt_timeframe: 1h
ai_prompt_candle_count: 100

# OpenRouter / DeepSeek V4 Flash
openrouter_model: deepseek/deepseek-v4-flash
openrouter_reasoning_effort: high
openrouter_max_tokens: 8192
openrouter_timeout_seconds: 300.0

# Portfolio allocation
fixed_leverage: 1
capital_usage_ratio: 0.99
rebalance_threshold_pct: 0.03
stop_loss_pct: 0.04

# Passive slots are evaluated in this exact priority order.
passive_symbols:
  - CLUSDT
  - XAUUSDT
  - QQQUSDT
  - BTCUSDT

# Active slots use abs(abs(24h change %) - target) closeness.
active_targets:
  - 4.0
  - 8.0
active_candidate_pool_size: 10

# Binance public API stability knobs for active screening.
screener_quote: USDT
screener_timeout: 30.0
screener_retries: 3
screener_request_sleep: 0.10
